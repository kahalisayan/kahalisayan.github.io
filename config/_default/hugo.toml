# -- Site Configuration --
# https://blowfish.page/docs/getting-started/

theme = "blowfish"

# GitHub *user* site — served at the domain root.
baseURL = "https://kahalisayan.github.io/"

defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false
enableEmoji = false

# Analytics are OFF by default. See README.md to enable a privacy-friendly option.
# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 100
